spring.application.name=biblio

# Serveur local : http://localhost:8080
server.port=8080

# Base de donnees H2 locale (fichier dans le dossier data/ du projet)
spring.datasource.url=jdbc:h2:mem
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Execute schema.sql / data.sql au demarrage s'ils existent
spring.sql.init.mode=always

# Console web H2 : http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
