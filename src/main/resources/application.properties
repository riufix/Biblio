spring.application.name=biblio
server.port=8080

# Base de donnees PostgreSQL
# Valeurs par defaut pour lancer l'app hors Docker (conteneur db expose sur 5432).
# Dans Docker, docker-compose.yaml remplace ces valeurs par SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/db
spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cree / met a jour les tables a partir des @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Affiche les requetes SQL dans les logs (pratique pour verifier les INSERT)
spring.jpa.show-sql=true
